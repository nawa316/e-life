<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" filter="url(#dropGlow)" />

  <!-- Inner ambient circle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Lightning / Fast 'e' symbol combined with timeline clock & spark -->
  <g transform="translate(136, 120)">
    <!-- Stylized 'e' energy path -->
    <path d="M 180 30 C 110 30 50 85 50 155 C 50 225 110 275 185 275 C 225 275 255 260 270 240 L 225 205 C 215 215 198 225 180 225 C 145 225 110 200 105 160 L 275 160 C 278 150 280 138 280 125 C 280 65 235 30 180 30 Z M 108 120 C 115 80 145 65 180 65 C 215 65 240 85 245 120 L 108 120 Z" fill="#ffffff" />
    
    <!-- Sparkles of life -->
    <path d="M 230 -10 L 236 10 L 256 16 L 236 22 L 230 42 L 224 22 L 204 16 L 224 10 Z" fill="#facc15" />
    <path d="M 30 230 L 34 245 L 49 249 L 34 253 L 30 268 L 26 253 L 11 249 L 26 245 Z" fill="#38bdf8" />
  </g>
</svg>
